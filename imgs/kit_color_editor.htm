<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KO2 Kit Colour Editor</title>
<style>
	body {
		background: #1a1a1a;
		color: #ccc;
		font-family: Tahoma, sans-serif;
		font-weight: bold;
		display: flex;
		flex-direction: column;
		align-items: center;
		padding: 20px;
	}
	#editor-wrap {
		display: flex;
		flex-direction: column;
		align-items: stretch;
	}
	canvas {
		image-rendering: pixelated;
		border: 2px solid #555;
		margin-bottom: 20px;
	}
	.controls {
		display: flex;
		justify-content: space-between;
		margin-bottom: 20px;
	}
	.team-col h3 { margin: 0 0 8px 0; }
	.team-col {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		gap: 8px;
	}
	.team-col h3 { width: 100%; }
	.team-col:last-child {
		align-items: center;
		justify-content: flex-end;
	}
	.team-col:last-child h3 { text-align: right; }
	.color-group {
		display: flex;
		align-items: center;
		gap: 8px;
		padding: 4px 8px;
		border-radius: 4px;
	}
	.color-group.active {
		background: #0011aa;
	}
	.color-group label {
		font-size: 14px;
		font-weight: bold;
	}
	.swatch {
		width: 24px;
		height: 24px;
		border: 2px solid #888;
		display: inline-block;
		vertical-align: middle;
	}
	.key-hint {
		font-size: 11px;
		color: #888;
		min-width: 16px;
		text-align: center;
	}
	select {
		font-family: Tahoma, sans-serif;
		font-size: 14px;
		padding: 4px;
		background: #333;
		color: #eee;
		border: 1px solid #666;
	}
</style>
</head>
<body>

<h2>KO2 KIT COLOUR EDITOR</h2>
<div id="editor-wrap">
	<canvas id="canvas"></canvas>
	<div class="controls">
		<div class="team-col">
			<h3>TEAM A</h3>
			<div class="color-group" id="grp-0">
				<span class="key-hint" id="hint-0"></span>
				<span class="swatch" id="sw-orange"></span>
				<select id="sel-orange"></select>
			</div>
			<div class="color-group" id="grp-1">
				<span class="key-hint" id="hint-1"></span>
				<span class="swatch" id="sw-white"></span>
				<select id="sel-white"></select>
			</div>
		</div>
		<div class="team-col">
			<h3>TEAM B</h3>
			<div class="color-group" id="grp-2">
				<span class="key-hint" id="hint-2"></span>
				<span class="swatch" id="sw-blue"></span>
				<select id="sel-blue"></select>
			</div>
			<div class="color-group" id="grp-3">
				<span class="key-hint" id="hint-3"></span>
				<span class="swatch" id="sw-darkgray"></span>
				<select id="sel-darkgray"></select>
			</div>
		</div>
	</div>
</div>

<script>
	const SCALE = 4;

	// Original colours from the PNG palette
	const ORIG = {
		orange:   { r: 255, g: 51,  b: 0   }, // #ff3300
		blue:     { r: 0,   g: 51,  b: 238 }, // #0033ee
		white:    { r: 255, g: 255, b: 255 }, // #ffffff
		darkgray: { r: 102, g: 102, b: 85  }, // #666655
	};

	// 20 team colours from Team_Colors.png palette
	const PRESETS = [
		'#01A', '#01F', '#09F', '#0FF', '#FFF',
		'#BCC', '#444', '#000', '#700', '#A00',
		'#E00', '#F60', '#FF0', '#F8F', '#F06',
		'#905', '#040', '#0F0', '#60A', '#080',
	];

	const canvas = document.getElementById('canvas');
	const ctx = canvas.getContext('2d');

	let originalPixels = null; // Uint8ClampedArray snapshot of original image
	let imgW, imgH;

	function hexToRgb(hex) {
		let h = hex.slice(1);
		if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
		const v = parseInt(h, 16);
		return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
	}

	function rgbToHex(r, g, b) {
		return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1).toUpperCase();
	}

	function populateSelect(id, defaultHex) {
		const sel = document.getElementById(id);
		PRESETS.forEach(hex => {
			const opt = document.createElement('option');
			opt.value = hex;
			opt.textContent = hex;
			opt.style.background = hex;
			opt.style.color = luminance(hex) > 0.5 ? '#000' : '#fff';
			if (hex === defaultHex) opt.selected = true;
			sel.appendChild(opt);
		});
		sel.addEventListener('change', repaint);
		updateSwatch(id, defaultHex);
	}

	function luminance(hex) {
		const { r, g, b } = hexToRgb(hex);
		return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
	}

	function updateSwatch(selId, hex) {
		const key = selId.replace('sel-', 'sw-');
		document.getElementById(key).style.background = hex;
	}

	function colorsMatch(r, g, b, target) {
		return r === target.r && g === target.g && b === target.b;
	}

	function repaint() {
		const mapping = {
			orange:   hexToRgb(document.getElementById('sel-orange').value),
			blue:     hexToRgb(document.getElementById('sel-blue').value),
			white:    hexToRgb(document.getElementById('sel-white').value),
			darkgray: hexToRgb(document.getElementById('sel-darkgray').value),
		};

		// Update swatches
		for (const key of Object.keys(mapping)) {
			updateSwatch('sel-' + key, rgbToHex(mapping[key].r, mapping[key].g, mapping[key].b));
		}

		// Work on 1:1 pixel data, then scale up
		const offscreen = new OffscreenCanvas(imgW, imgH);
		const offCtx = offscreen.getContext('2d');
		const imgData = offCtx.createImageData(imgW, imgH);
		const src = originalPixels;
		const dst = imgData.data;

		for (let i = 0; i < src.length; i += 4) {
			const r = src[i], g = src[i + 1], b = src[i + 2], a = src[i + 3];
			let nr = r, ng = g, nb = b;

			for (const [origKey, newCol] of Object.entries(mapping)) {
				const orig = ORIG[origKey];
				if (colorsMatch(r, g, b, orig)) {
					nr = newCol.r;
					ng = newCol.g;
					nb = newCol.b;
					break;
				}
			}

			dst[i] = nr;
			dst[i + 1] = ng;
			dst[i + 2] = nb;
			dst[i + 3] = a;
		}

		offCtx.putImageData(imgData, 0, 0);

		ctx.imageSmoothingEnabled = false;
		ctx.clearRect(0, 0, canvas.width, canvas.height);
		ctx.drawImage(offscreen, 0, 0, canvas.width, canvas.height);
	}

	// Load image
	const img = new Image();
	img.onload = () => {
		imgW = img.width;
		imgH = img.height;
		canvas.width = imgW * SCALE;
		canvas.height = imgH * SCALE;

		// Draw at 1:1 to capture original pixels
		const tmp = new OffscreenCanvas(imgW, imgH);
		const tmpCtx = tmp.getContext('2d');
		tmpCtx.drawImage(img, 0, 0);
		originalPixels = tmpCtx.getImageData(0, 0, imgW, imgH).data.slice();

		// Populate selects with defaults
		populateSelect('sel-orange',   '#FF0');
		populateSelect('sel-white',    '#FFF');
		populateSelect('sel-blue',     '#01A');
		populateSelect('sel-darkgray', '#444');

		repaint();
		updateHints();
	};
	const SELECT_IDS = ['sel-orange', 'sel-white', 'sel-blue', 'sel-darkgray'];
	let activeIdx = 0;

	function updateHints() {
		for (let i = 0; i < 4; i++) {
			document.getElementById('hint-' + i).innerHTML = i === activeIdx ? '&#9650;&#9660;' : '';
			document.getElementById('grp-' + i).classList.toggle('active', i === activeIdx);
		}
	}

	function cycleSelect(id, direction) {
		const sel = document.getElementById(id);
		let i = sel.selectedIndex + direction;
		if (i >= sel.options.length) i = 0;
		if (i < 0) i = sel.options.length - 1;
		sel.selectedIndex = i;
		repaint();
	}

	document.addEventListener('keydown', e => {
		switch (e.key) {
			case 'ArrowUp':
				e.preventDefault();
				cycleSelect(SELECT_IDS[activeIdx], -1);
				break;
			case 'ArrowDown':
				e.preventDefault();
				cycleSelect(SELECT_IDS[activeIdx], 1);
				break;
			case 'ArrowLeft':
				e.preventDefault();
				if (activeIdx > 0) { activeIdx--; updateHints(); }
				break;
			case 'ArrowRight':
				e.preventDefault();
				if (activeIdx < 3) { activeIdx++; updateHints(); }
				break;
		}
	});
